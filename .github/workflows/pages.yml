name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_browser_checks:
        description: 'Temporary demo deployment: skip browser checks (build and unit tests remain required)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix build outputs
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ''
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Check pinned toolchain
        run: nix build --no-update-lock-file --print-build-logs .#checks.x86_64-linux.toolchain
      - name: Build and verify the Modelica browser application
        run: nix develop --no-update-lock-file .#ci --command bash scripts/verify.sh --build-only
      - name: Report pending full-SLAM compiler admission
        id: compiler-admission
        continue-on-error: true
        run: nix develop --no-update-lock-file .#ci --command npm run test:compiler-admission
      - name: Summarize compiler admission
        if: always()
        run: |
          echo "Experimental full-SLAM compiler admission: ${{ steps.compiler-admission.outcome }}. This must pass before full SLAM can be advertised." >> "$GITHUB_STEP_SUMMARY"
      # Smoke shards test this exact build; only an explicit manual demo can skip them.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  browser:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_browser_checks) }}
    name: Browser smoke (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix build outputs
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ''
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/download-artifact@v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Restore the verified static build
        run: |
          mkdir -p dist
          tar --extract --file "$RUNNER_TEMP/pages-artifact/artifact.tar" --directory dist
      - name: Install test dependencies and run this browser shard
        run: |
          nix develop --no-update-lock-file .#ci --command bash -c 'npm ci && npm run test:browser -- --shard=${{ matrix.shard }}/4'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.browser.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_browser_checks))
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
