name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Content-addressed Nix outputs use GitHub's cache; cache.nixos.org
      # remains the upstream for already-published toolchain dependencies.
      - name: Cache Nix build outputs
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ''
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Check pinned toolchain
        run: nix build --no-update-lock-file --print-build-logs .#checks.x86_64-linux.toolchain
      - name: Build and verify the Modelica browser application
        run: nix develop --no-update-lock-file .#ci --command bash scripts/verify.sh
      - name: Report pending full-SLAM compiler admission (not part of the inertial demo)
        id: compiler-admission
        continue-on-error: true
        run: nix develop --no-update-lock-file .#ci --command npm run test:compiler-admission
      - name: Summarize compiler admission
        if: always()
        run: |
          echo "Full-SLAM compiler admission: ${{ steps.compiler-admission.outcome }}. This experimental suite must pass before full SLAM can be advertised." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
