name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_browser_checks:
        description: 'Temporary demo deployment: skip browser checks (build and unit tests remain required)'
        type: boolean
        required: false
        default: false
      office_loop_diagnostic:
        description: 'Capture the full office mission with software WebGL and retain pair/consensus evidence (no deployment)'
        type: boolean
        required: false
        default: false
      recorded_worker_parity:
        description: 'Replay the sealed 500 s RGB-D/IMU recording through the sandboxed CPU browser worker (no capture or deployment)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ secrets.RUMOCA_ARTIFACT_TOKEN || github.token }}
  # Keep the Rumoca download cache at the actions/cache path below (~ is /home/runner on the hosted runners).
  RUMOCA_DOWNLOAD_DIR: /home/runner/scratch/slam_web/downloads
  # Stay inside Ubuntu's system UID range for Nix's eight build users.
  NIX_FIRST_BUILD_UID: '900'
concurrency:
  group: pages-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.recorded_worker_parity && '-recorded-worker' || '' }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.recorded_worker_parity }}
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Configure checkout branch default
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Check pinned toolchain
        run: nix build --no-update-lock-file --print-build-logs .#checks.x86_64-linux.toolchain
      - name: Cache pinned Rumoca main package
        uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Build and verify the Modelica browser application
        run: nix develop --no-update-lock-file .#ci --command bash scripts/verify.sh --build-only
      - name: Check RGB-D registration and evaluator contracts
        run: |
          mkdir -p "$HOME/scratch/slam_web/build"
          nix build --impure --file scripts/slam-comparison-evaluator-env.nix --out-link "$HOME/scratch/slam_web/build/comparison-evaluator"
          SLAM_COMPARISON_PYTHON="$HOME/scratch/slam_web/build/comparison-evaluator/bin/python3" nix develop --no-update-lock-file .#ci --command npm run test:comparison
      - name: Report pending full-SLAM compiler admission
        id: compiler-admission
        continue-on-error: true
        run: nix develop --no-update-lock-file .#ci --command npm run test:compiler-admission
      - name: Summarize compiler admission
        if: always()
        run: |
          echo "Experimental full-SLAM compiler admission: ${{ steps.compiler-admission.outcome }}. This must pass before full SLAM can be advertised." >> "$GITHUB_STEP_SUMMARY"
      # Smoke shards test this exact build; only an explicit manual demo can skip them.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  browser:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.skip_browser_checks || inputs.recorded_worker_parity)) }}
    name: Browser smoke (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-24.04
    # Allow Nix/dependency setup plus the bounded twelve-minute browser suite.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Configure checkout branch default
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Cache pinned Rumoca main package
        uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Restore the verified static build
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --no-update-lock-file .#ci --command node scripts/restore-pages-artifact.mjs
      # Allow user namespaces on this ephemeral Ubuntu runner while keeping
      # Chromium's namespace sandbox enabled.
      - name: Enable Chromium namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install test dependencies and run this browser shard
        run: |
          nix develop --no-update-lock-file .#ci --command bash -c 'npm ci && npm run test:browser -- --shard=${{ matrix.shard }}/4'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && (inputs.office_loop_diagnostic || inputs.recorded_worker_parity)) &&
      needs.build.result == 'success' &&
      (needs.browser.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_browser_checks))
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

  office:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.office_loop_diagnostic }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Select fresh diagnostic output
        run: echo "OFFICE_CI_OUTPUT=$HOME/scratch/slam_web/profiles/office-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Enable Chromium namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore this run's verified static build
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --no-update-lock-file .#ci --command node scripts/restore-pages-artifact.mjs
      - name: Capture office mission and probe actual pairs
        env:
          OFFICE_CI_REUSE_DIST: '1'
        run: |
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-ci.sh "$OFFICE_CI_OUTPUT"
      - name: Retain capture, native snapshots, pairs and consensus evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: office-loop-software-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OFFICE_CI_OUTPUT }}
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
      - name: Summarize diagnostic scope
        if: always()
        run: |
          echo 'Software SwiftShader office diagnostic. Inspect capture/receipt.json and pipeline-status.json for completeness; partial artifacts do not establish GPU, accuracy or loop-closure acceptance.' >> "$GITHUB_STEP_SUMMARY"

  recorded-worker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recorded_worker_parity }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Select task-owned storage
        run: |
          parity_root="$RUNNER_TEMP/recorded-slam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RECORDED_SLAM_ROOT=$parity_root" >> "$GITHUB_ENV"
          echo "npm_config_cache=$parity_root/npm-cache" >> "$GITHUB_ENV"
          echo "RUMOCA_DOWNLOAD_DIR=$parity_root/rumoca-downloads" >> "$GITHUB_ENV"
          echo "SLAM_NATIVE_CACHE_ROOT=$parity_root/native-cache" >> "$GITHUB_ENV"
      - name: Check exclusive diagnostic mode
        if: ${{ inputs.skip_browser_checks || inputs.office_loop_diagnostic }}
        run: |
          echo 'Recorded worker parity must be selected alone.'
          exit 1
      - name: Install dependencies and verify comparison contract
        run: nix develop --no-update-lock-file .#ci --command bash -c 'npm ci && node --test scripts/recorded-slam-contract.test.mjs && node scripts/slam-native-assets.mjs --package'
      - name: Verify and unpack the pinned recording
        run: timeout --kill-after=5s 600s python3 scripts/prepare-recorded-slam-replay.py "$RECORDED_SLAM_ROOT/inputs"
      - name: Enable Chromium namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Replay recorded input once within executable bounds
        run: nix develop --no-update-lock-file .#ci --command python3 scripts/run-recorded-slam-browser.py "$RECORDED_SLAM_ROOT/inputs/fixture" "$RECORDED_SLAM_ROOT/run/output" "$RECORDED_SLAM_ROOT/run/cache"
      - name: Retain source binding, partial output and terminal evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: recorded-slam-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RECORDED_SLAM_ROOT }}/inputs/SETUP-*.json
            ${{ env.RECORDED_SLAM_ROOT }}/run/OPERATION*
            ${{ env.RECORDED_SLAM_ROOT }}/run/output
          if-no-files-found: warn
          retention-days: 7
      - name: State verification scope
        if: always()
        run: echo 'Recorded CPU worker parity only. Inspect RESULT.json and OPERATION-TERMINAL.json; no scene, new capture, GPU/stress, browser-throughput or deployment acceptance.' >> "$GITHUB_STEP_SUMMARY"
