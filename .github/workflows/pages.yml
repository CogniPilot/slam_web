name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_browser_checks:
        description: 'Temporary demo deployment: skip browser checks (build and unit tests remain required)'
        type: boolean
        required: false
        default: false
      office_loop_diagnostic:
        description: 'Capture the full office mission with software WebGL and retain pair/consensus evidence (no deployment)'
        type: boolean
        required: false
        default: false
      office_saved_replay:
        description: 'With office_loop_diagnostic: replay the fixed saved office capture in pinned Chromium; no new render or deployment'
        type: boolean
        required: false
        default: false
      office_candidate_comparison:
        description: 'With office_loop_diagnostic: build the pinned exporter, prove baseline parity, then compare the experimental office source without deployment'
        type: boolean
        required: false
        default: false
      office_phase_b_job:
        description: 'With office_loop_diagnostic: Phase B job on the frozen head (capture, pass1 or pass2); none for the modes above'
        type: choice
        options: [none, capture, pass1, pass2]
        default: none
      office_phase_b_head:
        description: 'Phase B: the frozen branch head; every Phase B job refuses to run on any other commit'
        type: string
        required: false
        default: ''
      office_phase_b_pin:
        description: 'Phase B pass1/pass2: the granted job-1 capture pin, exact JSON bytes'
        type: string
        required: false
        default: ''
      office_phase_b_pin_sha256:
        description: 'Phase B pass1/pass2: the granted sha256 of office_phase_b_pin'
        type: string
        required: false
        default: ''
      office_phase_b_candidate_pin:
        description: 'Phase B pass2: the granted job-2 artifact pin, exact JSON bytes'
        type: string
        required: false
        default: ''
      office_phase_b_candidate_pin_sha256:
        description: 'Phase B pass2: the granted sha256 of office_phase_b_candidate_pin'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ secrets.RUMOCA_ARTIFACT_TOKEN || github.token }}
  # Stay inside Ubuntu's system UID range for Nix's eight build users.
  NIX_FIRST_BUILD_UID: '900'
concurrency:
  # A Phase B job is one of three bound runs. Cancellation is decided by the newer run, so each Phase B dispatch gets its
  # own group: nothing can cancel it, and it cancels nothing. Every other run keeps the per-ref group.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.office_phase_b_job != 'none' && format('office-phase-b-{0}', github.run_id) || format('pages-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Configure checkout branch default
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Check pinned toolchain
        run: nix build --no-update-lock-file --print-build-logs .#checks.x86_64-linux.toolchain
      - name: Cache pinned Rumoca main package
        uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Build and verify the Modelica browser application
        run: nix develop --no-update-lock-file .#ci --command bash scripts/verify.sh --build-only
      - name: Check RGB-D registration and evaluator contracts
        run: |
          mkdir -p "$HOME/scratch/slam_web/build"
          nix build --impure --file scripts/slam-comparison-evaluator-env.nix --out-link "$HOME/scratch/slam_web/build/comparison-evaluator"
          SLAM_COMPARISON_PYTHON="$HOME/scratch/slam_web/build/comparison-evaluator/bin/python3" nix develop --no-update-lock-file .#ci --command npm run test:comparison
      - name: Report pending full-SLAM compiler admission
        id: compiler-admission
        continue-on-error: true
        run: nix develop --no-update-lock-file .#ci --command npm run test:compiler-admission
      - name: Summarize compiler admission
        if: always()
        run: |
          echo "Experimental full-SLAM compiler admission: ${{ steps.compiler-admission.outcome }}. This must pass before full SLAM can be advertised." >> "$GITHUB_STEP_SUMMARY"
      # Smoke shards test this exact build; only an explicit manual demo can skip them.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  browser:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_browser_checks) }}
    name: Browser smoke (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-24.04
    # Allow Nix/dependency setup plus the bounded twelve-minute browser suite.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Configure checkout branch default
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Cache pinned Rumoca main package
        uses: actions/cache@v6.1.0
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Restore the verified static build
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --no-update-lock-file .#ci --command node scripts/restore-pages-artifact.mjs
      # Allow user namespaces on this ephemeral Ubuntu runner while keeping
      # Chromium's namespace sandbox enabled.
      - name: Enable Chromium namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install test dependencies and run this browser shard
        run: |
          nix develop --no-update-lock-file .#ci --command bash -c 'npm ci && npm run test:browser -- --shard=${{ matrix.shard }}/4'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.office_loop_diagnostic) &&
      !(github.event_name == 'workflow_dispatch' && inputs.office_saved_replay) &&
      !(github.event_name == 'workflow_dispatch' && inputs.office_candidate_comparison) &&
      needs.build.result == 'success' &&
      (needs.browser.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_browser_checks))
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

  office:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.office_loop_diagnostic }}
    needs: build
    runs-on: ubuntu-24.04
    # Hold 5 (proposals for the deadline owner). Each Phase B job's cap is its worst case: setup 25 (checkout 3, Nix 8,
    # two caches 3 each, static build 6, grant guard 2) + its run step + a 15-minute upload, so the one-shot capture
    # always reaches the upload. Run steps carry their inner stage worst cases plus margin: capture 50 (31-minute capture
    # + about 15 of setup, contracts and flight checks), pass 1 65 (compiler, two exports, comparison, plan), pass 2 52
    # (restore, baseline replay pipeline, comparison, pass equality). Caps: capture 90, pass 1 105, pass 2 92. Other
    # office modes keep the 75-minute cap and GitHub's default step limits.
    timeout-minutes: ${{ inputs.office_phase_b_job == 'capture' && 90 || inputs.office_phase_b_job == 'pass1' && 105 || inputs.office_phase_b_job == 'pass2' && 92 || 75 }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 3 || 360 }}
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31.11.1
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 8 || 360 }}
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6.1.0
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 3 || 360 }}
        with:
          path: ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v6.1.0
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 3 || 360 }}
        with:
          path: ~/scratch/slam_web/downloads/rumoca-main-*
          key: rumoca-main-${{ hashFiles('rumoca-package.json') }}
      - name: Select fresh diagnostic output
        run: echo "OFFICE_CI_OUTPUT=$HOME/scratch/slam_web/profiles/office-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Enable Chromium namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore this run's verified static build
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 6 || 360 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --no-update-lock-file .#ci --command node scripts/restore-pages-artifact.mjs
      - name: Check Phase B grants and the frozen head
        if: ${{ inputs.office_phase_b_job != 'none' }}
        timeout-minutes: 2
        env:
          PHASE_B_JOB: ${{ inputs.office_phase_b_job }}
          PHASE_B_HEAD: ${{ inputs.office_phase_b_head }}
          PHASE_B_CONFLICT: ${{ inputs.office_saved_replay || inputs.office_candidate_comparison }}
          PHASE_B_PIN: ${{ inputs.office_phase_b_pin }}
          PHASE_B_PIN_SHA256: ${{ inputs.office_phase_b_pin_sha256 }}
          PHASE_B_CANDIDATE_PIN: ${{ inputs.office_phase_b_candidate_pin }}
          PHASE_B_CANDIDATE_PIN_SHA256: ${{ inputs.office_phase_b_candidate_pin_sha256 }}
        run: |
          set -euo pipefail
          if [ "$PHASE_B_CONFLICT" = true ]; then echo 'A Phase B job excludes saved replay and candidate comparison.' >&2; exit 2; fi
          if [ "$GITHUB_SHA" != "$PHASE_B_HEAD" ]; then echo "Phase B runs only on the frozen head $PHASE_B_HEAD, not $GITHUB_SHA." >&2; exit 2; fi
          # Grants are written byte for byte and must hash to the granted sha256 before any job step reads them.
          grant() {
            printf '%s' "$2" > "$RUNNER_TEMP/$1.json"
            [ "$(sha256sum "$RUNNER_TEMP/$1.json" | cut -d' ' -f1)" = "$3" ] || { echo "$1 does not match its granted sha256" >&2; exit 2; }
          }
          case "$PHASE_B_JOB" in
            capture)
              if [ -n "$PHASE_B_PIN$PHASE_B_CANDIDATE_PIN" ]; then echo 'The capture job takes no pins.' >&2; exit 2; fi ;;
            pass1)
              if [ -n "$PHASE_B_CANDIDATE_PIN" ]; then echo 'Pass 1 takes no candidate pin.' >&2; exit 2; fi
              grant capture-pin "$PHASE_B_PIN" "$PHASE_B_PIN_SHA256"
              { echo "OFFICE_PHASE_B_PIN=$RUNNER_TEMP/capture-pin.json"; echo "OFFICE_PHASE_B_PIN_SHA256=$PHASE_B_PIN_SHA256"; } >> "$GITHUB_ENV" ;;
            pass2)
              grant capture-pin "$PHASE_B_PIN" "$PHASE_B_PIN_SHA256"
              grant candidate-pin "$PHASE_B_CANDIDATE_PIN" "$PHASE_B_CANDIDATE_PIN_SHA256"
              { echo "OFFICE_PHASE_B_PIN=$RUNNER_TEMP/capture-pin.json"; echo "OFFICE_PHASE_B_PIN_SHA256=$PHASE_B_PIN_SHA256"
                echo "OFFICE_PHASE_B_CANDIDATE_PIN=$RUNNER_TEMP/candidate-pin.json"; echo "OFFICE_PHASE_B_CANDIDATE_PIN_SHA256=$PHASE_B_CANDIDATE_PIN_SHA256"; } >> "$GITHUB_ENV" ;;
          esac
      - name: Capture office mission and probe actual pairs
        if: ${{ !inputs.office_saved_replay && !inputs.office_candidate_comparison && (inputs.office_phase_b_job == 'none' || inputs.office_phase_b_job == 'capture') }}
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 50 || 360 }}
        env:
          OFFICE_CI_REUSE_DIST: '1'
          # Phase B job 1 flies the two-circuit route; every other capture keeps the single loop.
          OFFICE_CI_SCENE: ${{ inputs.office_phase_b_job == 'capture' && 'office-loop-two-circuit' || 'office-loop' }}
        run: |
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-ci.sh "$OFFICE_CI_OUTPUT"
      - name: Replay pinned saved office observations without rendering
        if: ${{ inputs.office_saved_replay && !inputs.office_candidate_comparison && inputs.office_phase_b_job == 'none' }}
        env:
          OFFICE_REPLAY_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-replay.sh "$OFFICE_CI_OUTPUT"
      - name: Build and compare the isolated office candidate
        if: ${{ inputs.office_candidate_comparison && inputs.office_phase_b_job == 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_REPLAY_ARTIFACT_TOKEN: ${{ github.token }}
          OFFICE_COMPARE_CONFLICT: ${{ inputs.office_saved_replay }}
        run: |
          if [ "$OFFICE_COMPARE_CONFLICT" = true ]; then
            echo 'Choose saved replay or candidate comparison, not both.' >&2
            exit 2
          fi
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-comparison.sh "$OFFICE_CI_OUTPUT"
      - name: Phase B pass 1 (job 2), candidate on the sealed capture
        if: ${{ inputs.office_phase_b_job == 'pass1' }}
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_REPLAY_ARTIFACT_TOKEN: ${{ github.token }}
          OFFICE_PHASE_B_PASS: '1'
        run: |
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-comparison.sh "$OFFICE_CI_OUTPUT"
      - name: Phase B pass 2 (job 3), baseline and candidate replays of the sealed inputs
        if: ${{ inputs.office_phase_b_job == 'pass2' }}
        timeout-minutes: 52
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_REPLAY_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$OFFICE_CI_OUTPUT")"
          nix develop --no-update-lock-file .#ci --command bash scripts/run-office-phase-b-pass2.sh "$OFFICE_CI_OUTPUT"
      - name: Retain capture, native snapshots, pairs and consensus evidence
        if: always()
        timeout-minutes: ${{ inputs.office_phase_b_job != 'none' && 15 || 360 }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: office-loop-software-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OFFICE_CI_OUTPUT }}
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
      - name: Summarize diagnostic scope
        if: ${{ always() && !inputs.office_saved_replay && !inputs.office_candidate_comparison && inputs.office_phase_b_job == 'none' }}
        run: |
          echo 'Software SwiftShader office diagnostic. Inspect capture/receipt.json and pipeline-status.json for completeness; partial artifacts do not establish GPU, accuracy or loop-closure acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize Phase B scope
        if: ${{ always() && inputs.office_phase_b_job != 'none' }}
        env:
          PHASE_B_JOB: ${{ inputs.office_phase_b_job }}
        run: |
          echo "Phase B job: $PHASE_B_JOB on the frozen head. Inspect pipeline-status.json first. Plans, boundaries and loop evidence in this artifact stay coordinator-only until the blind labels are sealed; no verdict, GPU or deployment result." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize saved replay scope
        if: ${{ always() && inputs.office_saved_replay && !inputs.office_candidate_comparison }}
        run: |
          echo 'Saved RGB-D/IMU replay in pinned sandboxed Chromium; no new rendering. Inspect replay/receipt.json and pipeline-status.json. Only a complete exact baseline qualifies declared-state snapshots; no transient proposal, GPU, accuracy or closure acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize candidate comparison scope
        if: ${{ always() && inputs.office_candidate_comparison }}
        run: |
          echo 'Whole-native candidate collection. Inspect compiler provenance, baseline parity, exact prefix, declared snapshots and late edge/correction effects. No external native assets, new rendering, GPU, deployment or automatic closure acceptance.' >> "$GITHUB_STEP_SUMMARY"
