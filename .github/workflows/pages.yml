name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v4
        with:
          path: |
            ~/scratch/slam_web/build/npm-cache
          key: ${{ runner.os }}-slam-${{ hashFiles('flake.lock', 'package-lock.json') }}
      - name: Check pinned toolchain
        run: nix flake check --no-update-lock-file
      - name: Build and verify the Modelica browser application
        run: nix develop --no-update-lock-file .#ci --command bash scripts/verify.sh
      - name: Report pending full-SLAM compiler admission (not part of the inertial demo)
        id: compiler-admission
        continue-on-error: true
        run: nix develop --no-update-lock-file .#ci --command npm run test:compiler-admission
      - name: Summarize compiler admission
        if: always()
        run: |
          echo "Full-SLAM compiler admission: ${{ steps.compiler-admission.outcome }}. This experimental suite must pass before full SLAM can be advertised." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
